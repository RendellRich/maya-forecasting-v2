# Daily Maya v2 runs before the 16:00 UTC buy deadline (10 am MDT / 9 am MST): 14:20, 15:00 and 15:40 UTC.
# GitHub can start scheduled jobs late, so three runs make it likely one lands in time. The last run before the
# deadline is the forecast of record; live_forecast.py locks it, so a late run cannot replace it.
# Uses the repository secret EIA_API_KEY if set (free key: https://www.eia.gov/opendata/); otherwise EIA's rate-limited DEMO_KEY.
name: Maya v2 daily forecast
on:
  schedule:
    - cron: "20 14 * * *"
    - cron: "0 15 * * *"
    - cron: "40 15 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/live_forecast.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - run: python pipeline/make_summary.py
      - name: Commit the new forecast
        run: |
          git config user.name "maya-bot"
          git config user.email "maya-bot@users.noreply.github.com"
          git add live/ pipeline/data/ app/data/
          git diff --cached --quiet || git commit -m "Daily forecast $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs --autostash origin main
          git push
